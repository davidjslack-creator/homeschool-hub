<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batter Blocks – the fraction bakery</title>
<style>
:root{--fs:20px;--ink:#2b2350;--purple:#6b4fd8;--purple2:#8a73f0;--gold:#ffbf1f;--green:#1fa863;--red:#d9534f;--card:#ffffff;--bg1:#5b3fd1;--bg2:#2a8ee0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;min-height:100vh;font-family:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1180px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.18)}
h1,h2,h3{margin:.2em 0}
.btn{border:0;border-radius:16px;padding:.7em 1.2em;font-weight:800;font-size:1.05rem;min-height:56px;background:var(--purple);color:#fff;box-shadow:0 5px 0 #4330a3;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4330a3}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 5px 0 #c68e00}
.btn.green{background:var(--green);box-shadow:0 5px 0 #0f7a45}
.btn.ghost{background:#efeaff;color:var(--purple);box-shadow:0 4px 0 #cfc6f5}
.btn.small{min-height:44px;padding:.4em .9em;font-size:.9rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#fff}
.top .pill{background:rgba(255,255,255,.2);padding:.25em .8em;border-radius:999px;font-weight:800}
/* home */
.hero{text-align:center;color:#fff;padding:10px 0 4px}
.hero h1{font-size:2.6rem;text-shadow:0 4px 0 rgba(0,0,0,.25);letter-spacing:.5px}
.hero p{font-size:1.1rem;margin:.2em 0 .6em;opacity:.95}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:14px 0}
.mode{text-align:left;border:0;background:#fff;border-radius:24px;padding:16px;box-shadow:0 7px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
.mode:active{transform:translateY(3px)}
.mode h2{font-size:1.4rem;margin:0}
.mode p{margin:0;font-size:.95rem;line-height:1.35}
.mode .art{height:90px;display:flex;align-items:center;justify-content:center;border-radius:16px}
.mode .best{font-size:.85rem;font-weight:800;color:var(--purple)}
.mode.q .art{background:linear-gradient(135deg,#ffe58a,#ffb347)}
.mode.p .art{background:linear-gradient(135deg,#ffd0c0,#ff8f7a)}
.mode.b .art{background:linear-gradient(135deg,#d8c9ff,#8e72ee)}
.footrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.progress{height:16px;background:#e7e1fb;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#ffb400,#ff7a00);border-radius:99px;transition:width .4s}
/* setup */
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:12px 0}
.lvb{border:3px solid #d8d0fa;background:#fff;border-radius:16px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;min-height:64px}
.lvb.on{border-color:var(--purple);background:#f1edff;box-shadow:0 0 0 3px #cfc3ff}
.lvb b.n{background:var(--purple);color:#fff;border-radius:50%;width:2em;height:2em;display:flex;align-items:center;justify-content:center;flex:none}
.lvb small{display:block;opacity:.75}
.star{color:#ffb400;font-size:.85rem}
/* play */
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.hud .pill{background:#fff;border-radius:999px;padding:.3em .9em;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.15);font-size:.95rem}
.hud .pill.g{background:#fff4c9}
.strip{margin-bottom:10px}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:14px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.skillbadge{display:inline-block;background:#efeaff;color:var(--purple);border-radius:99px;padding:.15em .8em;font-weight:800;font-size:.8rem}
.prompt{font-size:1.35rem;font-weight:700;margin:.5em 0;line-height:1.35}
.model{display:flex;justify-content:center;margin:6px 0 10px;overflow-x:auto}
.shapes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.shape{display:block}
.shape .cell{cursor:default}
.shapes.tap .cell{cursor:pointer}
.shapes.tap .cell:hover{filter:brightness(.92)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-weight:800}
.fr>span:first-child{border-bottom:.11em solid currentColor;padding:0 .22em .04em}
.fr>span:last-child{padding:.04em .22em 0}
.mx{display:inline-flex;align-items:center;gap:.08em;vertical-align:middle}
.mx .wn{font-weight:800;font-size:1.25em;margin-right:.05em}
.entry{display:flex;flex-direction:column;gap:10px;align-items:center;margin:8px 0}
.slot{display:inline-flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:800;position:relative;padding:4px 8px;border-radius:14px}
.slot .pre{display:inline-flex;align-items:center;gap:6px}
.fld,.fstatic{min-width:3.1rem;height:3.1rem;border:3px solid var(--purple2);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.65rem;font-weight:800;padding:0 .3rem}
.fstatic{border-color:transparent;background:none}
.fld{cursor:pointer}
.fld.active{outline:5px solid #ffc83a;outline-offset:1px;background:#fffbe9}
.fld.good{background:#d8f6e3;border-color:var(--green)}
.fld.bad{background:#ffe4e1;border-color:var(--red)}
.fld.big{min-width:5rem}
.fld.w{min-width:3.6rem}
.fracbox{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fracbox .bar{width:100%;height:5px;background:var(--ink);border-radius:3px}
.cap{font-size:.7rem;font-weight:700;opacity:.75;text-align:left;width:9rem;line-height:1.15;position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
.colcap{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.colcap>.cap{position:static;transform:none;text-align:center;width:6rem}
.frow{position:relative;display:flex}
.fracbox .bar{width:3.6rem}
.slot small{font-size:.7rem}
.snote{position:absolute;left:0;right:0;top:-1.3em;text-align:center;font-size:.72rem;font-weight:800;color:#3f6fc6;white-space:nowrap}
.gem{background:#e9fbff;border:3px solid #52c6e8;border-radius:14px;padding:.5em .8em;font-size:.95rem;margin:6px 0;line-height:1.5}
.gem b.big{color:#0a7fa0;font-size:1.15em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad .btn{font-size:1.7rem;min-height:68px;padding:.2em}
.pad .btn.k{background:#fff;color:var(--ink);border:3px solid #cfc6f5;box-shadow:0 5px 0 #cfc6f5}
.pad .btn.k:active{box-shadow:0 2px 0 #cfc6f5}
.pad .wide{grid-column:1/-1}
.fb{min-height:3.2em;border-radius:16px;padding:.6em .9em;margin:8px 0;font-size:1.02rem;line-height:1.4;display:none}
.fb.show{display:block}
.fb.ok{background:#dcf7e7;border:3px solid var(--green)}
.fb.hint{background:#fff3d6;border:3px solid #ffb400}
.fb.part{background:#e4f0ff;border:3px solid #3f8cff}
.fb.info{background:#f1edff;border:3px solid var(--purple2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0}
.mc.sym{grid-template-columns:repeat(3,1fr)}
.opt{border:3px solid #cfc6f5;background:#fff;border-radius:16px;min-height:76px;font-size:1.5rem;font-weight:800;padding:8px;display:flex;align-items:center;justify-content:center}
.opt:active{transform:translateY(2px)}
.opt.gone{opacity:.35;pointer-events:none;background:#eee}
.opt.right{background:#d8f6e3;border-color:var(--green)}
.ordcards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0}
.ordc{border:3px solid #cfc6f5;background:#fff;border-radius:16px;min-width:96px;min-height:90px;font-size:1.6rem;padding:8px 12px;position:relative}
.ordc.sel{background:#f1edff;border-color:var(--purple);opacity:.6}
.ordc .badge{position:absolute;top:-10px;right:-8px;background:var(--gold);border-radius:50%;width:1.6em;height:1.6em;font-size:.9rem;font-weight:900;display:none;align-items:center;justify-content:center}
.ordc.sel .badge{display:flex}
.ltr{font-weight:900;color:var(--purple);margin-right:.3em}
.seqrow{text-align:center;font-size:1rem;min-height:1.6em;font-weight:700}
.chain{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 6px;align-items:center;justify-items:center;margin:6px auto;max-width:560px}
.chain .op{font-weight:900;font-size:1.15rem;background:#fff4c9;border-radius:12px;padding:.2em .6em;display:inline-flex;gap:.3em;align-items:center;border:2px solid #ffd45c}
.chain .node{background:#eef4ff;border:3px solid #7ba7ff;border-radius:18px;padding:8px 10px;min-width:100px;display:flex;justify-content:center;font-size:1.5rem}
.chain .node.given{background:#e1f7e8;border-color:#3cb371}
.chain .node.pick{background:#fffbe9}
.nodeslot .slot{padding:0}
/* overlays */
.modal{position:fixed;inset:0;background:rgba(30,15,80,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal .card{max-width:640px;width:100%;max-height:92vh;overflow:auto}
.chests{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.chest{background:none;border:0;padding:6px;border-radius:18px;min-width:120px}
.chest svg{display:block;margin:auto}
.chest:hover{background:#fff3c4}
.chest.dim{opacity:.35;pointer-events:none}
.chest.open{background:#fff3c4;animation:pop .4s}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.chestmsg{font-size:1.25rem;font-weight:800;text-align:center;min-height:2.6em}
.riv{display:flex;gap:8px;flex-wrap:wrap}
.rv{background:#fff;border-radius:16px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.rv.me{background:#fff4c9}
.rv small{display:block;font-weight:600;opacity:.7;font-size:.75rem;line-height:1}
.boss{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:8px 14px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.boss .hp{flex:1}
.hpbar{height:22px;background:#e9e2fb;border-radius:99px;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 0 0 2px #cfc6f5}
.hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ff5d73,#ff9c5a);transition:width .5s}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
.shop{display:grid;gap:10px;margin:10px 0}
.shopi{display:flex;gap:10px;align-items:center;border:3px solid #e1daf9;border-radius:16px;padding:8px 12px}
.shopi .t{flex:1}
.shopi small{display:block;opacity:.75}
.cust{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:6px 14px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.collect{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:10px}
.cc{background:#f7f4ff;border-radius:18px;padding:8px;text-align:center;font-weight:800;font-size:.9rem}
.cc small{display:block;font-weight:600;opacity:.7}
.crt.locked{filter:brightness(0) opacity(.22)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.45em .5em;border-bottom:2px solid #eee;text-align:left;vertical-align:middle}
.bar2{height:14px;border-radius:99px;background:#eee;overflow:hidden;min-width:90px}
.bar2>i{display:block;height:100%}
textarea.sum{width:100%;min-height:210px;font:15px/1.4 ui-monospace,Menlo,Consolas,monospace;border:3px solid #d8d0fa;border-radius:12px;padding:10px;-webkit-user-select:text;user-select:text}
.note{font-size:.85rem;opacity:.8}

/* ===== Creature Lab ===== */
.mode.l .art{background:linear-gradient(135deg,#c9f2d8,#58c98a)}
.labgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start;margin-top:8px}
@media (max-width:700px){.labgrid{grid-template-columns:1fr}}
.stagebox{background:linear-gradient(#e6f5ff,#fff);border-radius:18px;padding:6px;border:3px solid #cfe6fa;position:sticky;top:6px}
.stagebox svg{display:block;width:100%;height:auto}
.bp{background:#fff7dc;border:3px dashed #f2b83a;border-radius:16px;padding:8px 12px;font-size:1rem;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:6px}
.bp .bpi{font-weight:800;font-size:1.1rem;display:inline-flex;align-items:center;gap:.35em}
.bp small{font-weight:600;opacity:.75}
.pcard{border:3px solid #d8d0fa;border-radius:16px;padding:8px 10px;margin-bottom:8px;background:#fcfbff;transition:background .15s}
.pcard.hot{background:#fff9e0;border-color:#ffc83a}
.pcard.over{background:#e3f8ea;border-color:var(--green)}
.pcard.bad{border-color:var(--red);background:#fff2f0}
.pcard.okc{border-color:var(--green);background:#effaf2}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.pname{font-weight:900;font-size:1.1rem}
.need{font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.need small{font-weight:600;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:68px;align-items:flex-end;padding:6px;border-radius:12px;background:#f1eeff;margin:6px 0}
.chips .empty{opacity:.55;font-size:.85rem;padding:14px 6px;align-self:center}
.chip,.tile{touch-action:none;cursor:grab;background:#fff;border:3px solid #cfc6f5;border-radius:12px;padding:4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;font-weight:800;font-size:.85rem;-webkit-touch-callout:none}
.tile{font-size:.95rem;padding:6px 9px}
.chip.sel{outline:4px solid #ffc83a;background:#fffbe9}
.tile.hold{outline:4px solid #ffc83a;background:#fffbe9}
.chip.over{outline:4px solid var(--green)}
.drag-src{opacity:.35}
.dghost{position:fixed;z-index:200;pointer-events:none;opacity:.92;transform:translate(-50%,-60%) scale(1.12);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tray{margin-top:8px;background:#f7f4ff;border-radius:16px;padding:8px 10px}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tbtn{border:3px solid #cfc6f5;background:#fff;border-radius:14px;min-height:50px;padding:.3em .8em;font-weight:800;font-size:.95rem}
.tbtn:active{transform:translateY(2px)}
.tbtn.over{outline:4px solid var(--green);background:#e3f8ea}
.live{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live small{font-weight:600;opacity:.8;font-size:.8rem}
.live .pv{color:#0a8a4f}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.gc{background:#f7f4ff;border-radius:18px;padding:8px;text-align:center;font-weight:800}
.gc small{display:block;font-weight:600;opacity:.8;line-height:1.3}

/* ===== Batter Blocks additions ===== */
:root{--bg1:#e0707a;--bg2:#f6a85b}
body{background:linear-gradient(160deg,#d9627e,#f29b5a);background-attachment:fixed}
.mode.bk .art{background:linear-gradient(135deg,#ffe3b5,#ffb067)}
.mode.cl .art{background:linear-gradient(135deg,#c9f2d8,#58c98a)}
.hart{display:flex;justify-content:center;align-items:flex-end;min-height:112px;background:linear-gradient(#fff7ea,#fff);border-radius:12px;margin:6px 0;padding:4px;border:2px solid #f0e2c8}
.hart svg{height:112px;width:auto;max-width:100%}
.scene{border-radius:18px;overflow:hidden;border:3px solid #f0d6b0;background:#fff7ea}
.scene svg{display:block;width:100%;height:auto}
.bubble{background:#fff;border:3px solid #f2b83a;border-radius:16px;padding:8px 12px;margin-top:8px;font-size:1rem;line-height:1.4;position:relative}
.bubble b.cn{color:#c4511f}
.trayg{margin-top:6px}
.trayg h4{margin:.2em 0;font-size:.85rem;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
.tile svg.ti{width:46px;height:46px}
.bigbake{background:linear-gradient(90deg,#ffe29a,#ffc2d4);border-radius:14px;padding:6px 12px;font-weight:900;text-align:center;margin-top:6px}
.stagebox.scenebox{padding:0;background:none;border:0}
.decor{display:flex;gap:6px;flex-wrap:wrap}
.shopi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #eee}.shopi small{display:block;opacity:.75;font-size:.8rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2350;color:#fff;padding:.7em 1.2em;border-radius:99px;font-weight:800;z-index:120;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.center{text-align:center}
:focus-visible{outline:4px solid #ffc83a;outline-offset:2px}

/* ===== Phone-friendly layer ===== */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,[data-act],.pcard,.tbtn{touch-action:manipulation}
.chip,.tile{touch-action:none}
.modes{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.lv{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
.gal{grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
.tblwrap{overflow-x:auto;max-width:100%}
.actrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.actrow .tools{flex-wrap:nowrap}
#bbbtns{display:flex;gap:8px;justify-content:center;flex:1 1 55%}
#bbbtns .btn{flex:1;max-width:560px;font-size:1.25rem}
.custface{width:44px;height:44px;flex:none}
.bubble{display:flex;gap:10px;align-items:center}
.chip{min-height:52px;min-width:52px;justify-content:center}
.tile{min-height:52px;min-width:52px;justify-content:center}
.holding .pcard{border-style:dashed;border-color:#ffb400;box-shadow:0 0 0 3px #ffe08a}
.holding .pcard .chips .empty::after{content:' \2190 tap here'}
.dghost.touchg{transform:translate(-50%,-150%) scale(1.25);box-shadow:0 12px 24px rgba(0,0,0,.35)}
.btn.small{min-height:48px}
/* phones (portrait) and short landscape phones */
@media (max-width:700px),(max-height:500px){
 #app{padding:8px 8px 16px}
 .card{padding:10px 10px;border-radius:18px}
 .hud{gap:6px;margin-bottom:6px}
 .hud .pill{font-size:.8rem;padding:.25em .6em}
 .hud .pill.opt{display:none}
 .hud .btn.small{padding:.3em .7em;font-size:.85rem}
 .skillbadge{font-size:.72rem}
 .bp{font-size:.88rem;padding:6px 8px;gap:4px 12px;margin-top:4px}
 .bp .bpi{font-size:1rem}
 .bp small{display:none}
 .labgrid{grid-template-columns:1fr!important;gap:8px}
 .scene.inplay{display:none}
 .bubble{font-size:.88rem;padding:6px 10px;margin-top:0;line-height:1.3}
 .bigbake{font-size:.85rem;padding:4px 8px}
 .stagebox{position:static;padding:2px}
 .stagebox svg{max-height:120px}
 .pcard{padding:6px 8px;margin-bottom:6px}
 .pname{font-size:1rem}
 .hart{min-height:76px;margin:4px 0}
 .hart svg{height:76px}
 .chips{min-height:58px;padding:4px;margin:4px 0}
 .live{font-size:1rem}
 .modal{padding:6px}
 .modal .card{max-height:96vh}
 #toast{top:10px;bottom:auto}
 .hero h1{font-size:2rem}
 /* the dock: shelf + tools + feedback + Check/Hint/Undo always reachable */
 body.inplay .dock{position:fixed;z-index:40;background:#fffaf2;box-shadow:0 -6px 18px rgba(0,0,0,.22);padding:6px 8px calc(6px + env(safe-area-inset-bottom));overflow-y:auto}

<body>
<div id="app"><div id="screen"></div></div>
<div id="modal"></div>
<canvas id="confetti"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== tiny helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=pairs=>{let t=pairs.reduce((s,p)=>s+p[1],0),r=Math.random()*t;for(const p of pairs){if((r-=p[1])<=0)return p[0]}return pairs[0][0]};
const coprimes=d=>{const r=[];for(let i=1;i<d;i++)if(gcd(i,d)===1)r.push(i);return r};
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><span class="wn">${w}</span>${fr(n,d)}</span>`;
const showVal=(n,d)=>(n>d&&n%d)?mx(Math.floor(n/d),n%d,d):fr(n,d);
const tx=(n,d)=>`${n}/${d}`;
const txm=(n,d)=>(n>d&&n%d)?`${Math.floor(n/d)} ${n%d}/${d}`:`${n}/${d}`;
const redu=(n,d)=>{const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const cap=s=>s[0].toUpperCase()+s.slice(1);

/* ===== skills ===== */
const SK={
 b1:{n:'Bake 1',name:'Bakery: scoop & build amounts',desc:'Fill cups, spoons, sticks and eggs to match the order. Combine same-size scoops.'},
 b2:{n:'Bake 2',name:'Bakery: halve & double a recipe',desc:'Cut a recipe in half or double it. Overflow spills into a new whole cup.'},
 b3:{n:'Bake 3',name:'Bakery: take away (same-size pieces)',desc:'Spills and snacks: subtract, then pour into bigger cups to simplify.'},
 b4:{n:'Bake 4',name:'Bakery: cut cakes into slices',desc:'Slice a cake and serve exactly the fraction on the order.'},
 b5:{n:'Big Bake',name:'Bakery: the Big Bake (a mix of everything)',desc:'A grand order with several ingredients at once.'},
 l1:{n:'Lab 1',name:'Creature Lab: measure & combine doses',desc:'Drop fraction blocks into each ingredient and combine them into the amount on the formula.'},
 l2:{n:'Lab 2',name:'Creature Lab: simplify blocks',desc:'Match the formula exactly in simplest form. Combine, slice and squish.'},
 l3:{n:'Lab 3',name:'Creature Lab: regroup wholes & mixed numbers',desc:'Overflowing flasks: turn improper amounts into wholes plus a fraction, and back.'}
};
const BAKEIDS=['b1','b2','b3','b4'],LABIDS=['l1','l2','l3'],ALLSK=['b1','b2','b3','b4','b5','l1','l2','l3'];
const TAGNAME={unsimplified:'Answered correctly but needed a nudge to simplify',bk_merge:'Needed a nudge to combine same-size pieces',bk_regroup:'Needed a nudge to regroup into wholes or mixed numbers',bk_slice:'Tried to combine different-size pieces',
 lab_merge:'Needed a nudge to combine blocks (Creature Lab)',lab_regroup:'Needed a nudge to regroup into wholes or mixed numbers (Creature Lab)',lab_slice:'Tried to combine different-size pieces (Creature Lab)'};
const MODES={
 bakery:{name:'Fraction Bakery',tag:'Run the bakery: fill measuring cups, halve and double recipes, slice cakes. Earn coins and decorate your shop.',total:7},
 lab:{name:'Creature Lab',tag:'Mad science! Measure Lightning Essence, Dragon Toenail and Ghost Goo with fraction blocks, then zap the cauldron to brew a creature.',total:7}
};

/* ===== storage (localStorage only, this device) ===== */
const KEY='batterBlocks_v1';
function defState(){return{coins:0,best:{bakery:0,lab:0},gallery:[],bakery:{up:{oven:0,mixer:0,display:0},decor:[],served:0,trophies:0},skills:{},tags:{},sessions:[],misses:[],settings:{mute:false,big:0}}}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const d=defState();if(!s||typeof s!=='object')return d;
 const o=Object.assign(d,s),df=defState();o.best=Object.assign(df.best,s.best||{});o.settings=Object.assign(df.settings,s.settings||{});
 o.bakery=Object.assign(df.bakery,s.bakery||{});o.bakery.up=Object.assign(df.bakery.up,(s.bakery||{}).up||{});if(!Array.isArray(o.bakery.decor))o.bakery.decor=[];
 return o}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rec(id){return S.skills[id]||(S.skills[id]={att:0,full:0,partial:0,retry:0,shown:0,tier:1,streak:0,bad:0})}
ALLSK.forEach(rec);
function applyFS(){document.documentElement.style.setProperty('--fs',[20,23,26][S.settings.big||0]+'px')}
applyFS();

/* ===== sound (WebAudio beeps) ===== */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type,vol,when){if(S.settings.mute)return;const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={
 tap:()=>beep(440,.05,'square',.04),
 ok:()=>[523,659,784].forEach((f,i)=>beep(f,.16,'triangle',.13,i*.09)),
 part:()=>[523,622].forEach((f,i)=>beep(f,.16,'triangle',.11,i*.1)),
 oops:()=>{beep(330,.18,'sine',.09);beep(294,.22,'sine',.08,.14)},
 chest:()=>[392,523,659,784,1047].forEach((f,i)=>beep(f,.14,'triangle',.12,i*.07)),
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.2,'triangle',.13,i*.1)),
 coin:()=>{beep(988,.07,'square',.06);beep(1319,.15,'square',.06,.07)},
 zap:()=>{[220,330,180,660,990,1320].forEach((f,i)=>beep(f,.12,'sawtooth',.06,i*.06));[784,1047].forEach((f,i)=>beep(f,.25,'triangle',.12,.4+i*.12))},
 hit:()=>{beep(200,.12,'sawtooth',.08);beep(140,.15,'sawtooth',.07,.08)}
};
function sfx(n){try{SFX[n]()}catch(e){}}

/* ===== confetti ===== */
let confId=0;
function confetti(count){
 const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const N=reduce?30:(count||140);
 const ps=Array.from({length:N},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.35,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:6+Math.random()*8,col:`hsl(${Math.random()*360},90%,60%)`,rot:Math.random()*6,vr:(Math.random()-.5)*.3}));
 const id=++confId;let t=0;
 (function step(){if(id!==confId)return;x.clearRect(0,0,c.width,c.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.rot+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});
  if(++t<170)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}
let toastT=0;
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2200)}

/* ===== Block board: ONE engine shared by Bakery and Creature Lab ===== */
let G=null,B=null,DR=null,SUPPRESS=0,ART=0;
const DCOL={1:'#2fb36d',2:'#ff7a59',3:'#a06be0',4:'#3f8cff',5:'#ffb400',6:'#e0509a',8:'#20b2aa',10:'#8aa100',12:'#d0642b',16:'#7a5cc8'};
const dcol=d=>DCOL[d]||'#7a7a9a';
const TOOLS=[['slice2','Slice \u00D72','Slicer: cut every piece of the block into 2 smaller equal pieces'],['slice3','Slice \u00D73','Slicer: cut every piece into 3 equal pieces'],['slice5','Slice \u00D75','Slicer: cut every piece into 5 equal pieces'],['apart','Break apart','Split a block into single pieces'],['merge','Combine','Combine (merge) same-size blocks into one block'],['simplify','Simplify','Squish pieces into fewer, bigger equal pieces (pour into a bigger cup)'],['regroup','Regroup','Turn a full whole into a whole block: 5/4 becomes 1 and 1/4'],['remove','Take out','Take the block away']];
const bbSum=bl=>{let D=1;bl.forEach(b=>D=lcm(D,b.d));let N=0;bl.forEach(b=>N+=b.n*(D/b.d));return{N,D}};
const H=id=>B.holders.find(h=>h.id===id);

/* ----- canonical form, analysis, tidy steps ----- */
function bbCanonBlocks(t){
 if(t.form==='mixed'){const q=Math.floor(t.n/t.d),r=t.n%t.d,o=[];if(q>0)o.push({n:q,d:1});if(r>0)o.push({n:r,d:t.d});return o}
 return[{n:t.n,d:t.d}];
}
function bbCanon(h){
 const bl=h.blocks,t=h.target;
 if(t.form!=='mixed')return bl.length===1&&bl[0].n===t.n&&bl[0].d===t.d;
 const q=Math.floor(t.n/t.d),r=t.n%t.d,whole=bl.filter(b=>b.d===1),frs=bl.filter(b=>b.d!==1);
 if(whole.reduce((s,b)=>s+b.n,0)!==q)return false;
 if(r===0)return frs.length===0;
 return frs.length===1&&frs[0].n===r&&frs[0].d===t.d;
}
function bbAnalyze(h){
 const {N,D}=bbSum(h.blocks),t=h.target,c=N*t.d-t.n*D;
 if(c!==0){const g=gcd(Math.abs(c),D*t.d);return{st:c<0?'less':'more',diff:{n:Math.abs(c)/g,d:D*t.d/g},N,D}}
 if(bbCanon(h))return{st:'ok',N,D};
 return Object.assign({st:'tidy',N,D},bbTidy(h));
}
function bbTidy(h){
 const bl=h.blocks,t=h.target,whole=bl.filter(b=>b.d===1),frs=bl.filter(b=>b.d!==1),nm=h.noun,P=h.art==='bake'?'bk':'lab';
 if(frs.length>1){
  const seen={};let dup=0;frs.forEach(b=>{if(seen[b.d])dup=b.d;seen[b.d]=1});
  if(dup)return{step:'merge',tag:P+'_merge',msg:`The ${nm} has several ${dup}ths blocks. <b>Combine</b> them into one block.`};
  return{step:'slice',tag:P+'_slice',msg:`The ${nm} blocks are different sizes. <b>Slice</b> the bigger pieces so the sizes match, then <b>Combine</b>.`};
 }
 if(frs.length===1){
  const b=frs[0];
  if(gcd(b.n,b.d)>1)return{step:'simplify',tag:'unsimplified',msg:`The ${nm} is ${b.n}/${b.d}: the right amount, but it can use bigger pieces. Tap <b>Simplify</b> (${h.bigger}).`};
  if(t.form==='mixed'&&b.n>b.d)return{step:'regroup',tag:P+'_regroup',msg:`The ${nm} is ${b.n}/${b.d}, which is more than a whole. Use <b>Regroup</b> to pull out the whole parts for a mixed number.`};
  if(t.form==='improper'&&whole.length)return{step:'unregroup',tag:P+'_regroup',msg:`This order wants ONE improper block for the ${nm}. <b>Slice</b> the whole into ${b.d}ths, then <b>Combine</b> it with the ${b.n}/${b.d} block.`};
 }
 if(t.form==='mixed'&&frs.length===0&&whole.length)return{step:'regroup',tag:P+'_regroup',msg:`Use <b>Regroup</b> so the ${nm} is wholes plus a fraction block.`};
 return{step:'merge',tag:P+'_merge',msg:`The ${nm} has the right amount. Tidy the blocks so they match the order exactly.`};
}
function amtHTML(n,d,form){return form==='mixed'&&n>d&&n%d?mx(Math.floor(n/d),n%d,d):fr(n,d)}
function unitOf(h,N,D){return h.unit?(N>D?h.unitPl:h.unit):''}
function needHTML(h){const t=h.target,u=unitOf(h,t.n,t.d);return `${amtHTML(t.n,t.d,t.form)}${u?' '+u:''}`}
function needText(h){const t=h.target,u=unitOf(h,t.n,t.d);return txm(t.n,t.d)+(u?' '+u:'')}
const bareNoun=h=>h.art==='bake'&&(h.type==='eggs'||h.type==='cake');
function itemHTML(h){return needHTML(h)+(bareNoun(h)?'':' '+esc(h.noun))}
function itemText(h){return needText(h)+(bareNoun(h)?'':' '+h.noun)}
function nowText(h,N,D){const u=unitOf(h,N,D);return(D===1?`${N}`:txm(N,D))+(u?' '+u:'')}
const formNote={proper:'one block, simplest form',improper:'one improper-fraction block, simplest form',mixed:'whole blocks + one fraction block, simplest form'};
function totalHTML(N,D){
 if(N===0)return `<span>Nothing yet: 0</span>`;
 let h=D===1?`<b>${N}</b> whole${N>1?'s':''}`:fr(N,D);
 if(D>1&&N>D)h+=` = ${N%D?mx(Math.floor(N/D),N%D,D):`<b>${N/D}</b>`}`;
 const g=gcd(N,D);
 if(D>1&&g>1)h+=` <small>simplest form: ${showVal(N/g,D/g)}</small>`;
 return h;
}

/* ----- art: every picture shows exactly the fraction it names ----- */
const INK='#2b2350',GHOST=`fill="none" stroke="${INK}" stroke-opacity=".35" stroke-dasharray="4 3" stroke-width="1.6"`;
function wedgePath(i,D,cx,cy,r,start,span){
 if(D===1&&span>=360)return null;
 const a0=(start+span*i/D)*Math.PI/180,a1=(start+span*(i+1)/D)*Math.PI/180;
 const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
 return `M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${span/D>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
}
function pieArt(n,D,inner,cx,cy,r){ // n of D wedges visible, wedges clip the inner picture
 cx=cx||50;cy=cy||52;r=r||44;const id='pa'+(++ART);let s='';
 const wp=i=>wedgePath(i,D,cx,cy,r,-90,360);
 for(let i=0;i<D;i++){const p=wp(i);s+=p?`<path d="${p}" ${GHOST}/>`:`<circle cx="${cx}" cy="${cy}" r="${r}" ${GHOST}/>`}
 if(n>0){
  const vis=[];for(let i=0;i<Math.min(n,D);i++)vis.push(wp(i));
  const clip=n>=D?'':`<clipPath id="${id}">${vis.map(p=>p?`<path d="${p}"/>`:`<circle cx="${cx}" cy="${cy}" r="${r}"/>`).join('')}</clipPath>`;
  s+=`${clip}<g ${n>=D?'':`clip-path="url(#${id})"`}>${inner}</g>`;
  if(D>1)for(let i=0;i<D;i++){const a=(-90+360*i/D)*Math.PI/180;s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(a)).toFixed(1)}" y2="${(cy+r*Math.sin(a)).toFixed(1)}" stroke="${INK}" stroke-width="1.6" stroke-opacity=".55"/>`}
 }
 return s;
}
function cupArt(n,D,col,pat){ // standard measuring cup: fill level n/D of a full cup
 const id='cu'+(++ART),body='M24 16 L76 16 L70 90 L30 90Z',H=74;let s='';
 s+=`<path d="M76 28 Q95 30 92 50 Q90 62 72 64" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><clipPath id="${id}"><path d="${body}"/></clipPath><path d="${body}" fill="#f4fbff"/>`;
 const hh=H*Math.min(n,D)/D;

/* ----- block operations ----- */
function bbSnap(){return JSON.stringify(B.holders.map(h=>h.blocks))}

function bbUndo(){
 if(!B||G.qs.done)return;
 const s=B.hist.pop();if(!s)return toast('Nothing to undo yet');

}
function bbAddBlock(hid,b,kind){
 if(!B||G.qs.done)return false;
 const h=H(hid);if(!h)return false;
 if(kind&&!h.accept.includes(kind)){toast(h.art==='bake'?`${h.name} doesn\u2019t use that. Try ${h.accept.map(k=>TGROUP[k].toLowerCase()).join(' or ')}.`:'That block does not go there.');return false}
 if(h.blocks.length>=14){toast('Lots of blocks here! Try combining some first.');return false}
 bbPush();h.blocks.push({n:b.n,d:b.d});B.sel=null;bbChanged();sfx('tap');return true;
}
function bbApply(tool,hid,idxs){
 if(!B||G.qs.done)return false;
 const h=H(hid);
 if(!h||!idxs.length){toast('First tap a block to pick it, then tap a tool.');return false}
 idxs=[...new Set(idxs)].sort((a,b)=>a-b);const bl=h.blocks;let nb=null,snapped=false;
 if(tool.startsWith('slice')){
  const k=+tool.slice(5);
  if(idxs.some(i=>bl[i].d*k>24)){toast('Those pieces would get too tiny! Try a smaller slice.');return false}
  nb=bl.map((b,i)=>idxs.includes(i)?{n:b.n*k,d:b.d*k}:b);
 }else if(tool==='apart'){
  nb=[];bl.forEach((b,i)=>{if(idxs.includes(i)&&b.n>1){for(let j=0;j<b.n;j++)nb.push({n:1,d:b.d})}else nb.push(b)});
  if(nb.length===bl.length){toast('Pick a block with more than one piece to break it apart.');return false}
 }else if(tool==='merge'){
  if(idxs.length<2){toast('Pick two or more blocks to combine. Tap one, then tap another.');return false}
  const d0=bl[idxs[0]].d;
  if(idxs.some(i=>bl[i].d!==d0)){toast('Combine needs same-size pieces. Slice the bigger ones so the sizes match!');return false}
  const sum=idxs.reduce((s,i)=>s+bl[i].n,0);nb=[];
  bl.forEach((b,i)=>{if(i===idxs[0]){if(sum===d0&&d0>1){nb.push({n:1,d:1});snapped=true}else nb.push({n:sum,d:d0})}else if(!idxs.includes(i))nb.push(b)});
 }else if(tool==='simplify'){
  let ch=false;nb=bl.map((b,i)=>{if(!idxs.includes(i))return b;const g=gcd(b.n,b.d);if(g>1&&b.d>1){ch=true;return{n:b.n/g,d:b.d/g}}return b});
  if(!ch){toast('Already in simplest form: no way to make the pieces bigger.');return false}
 }else if(tool==='regroup'){
  let ch=false;nb=[];
  bl.forEach((b,i)=>{if(idxs.includes(i)&&b.d>1&&b.n>=b.d){ch=true;const q=Math.floor(b.n/b.d),r=b.n%b.d;nb.push({n:q,d:1});if(r>0)nb.push({n:r,d:b.d})}else nb.push(b)});
  if(!ch){toast('Regroup needs a block that is one whole or more, like 5/4.');return false}

 bbPush();h.blocks=nb;B.sel=null;bbChanged();sfx(tool==='remove'?'tap':'chest');

}

 const t=document.elementFromPoint(e.clientX,e.clientY);

function genLab(kind,tier){
 const nparts=tier===1?rnd(1,2):tier===2?2:rnd(2,3);
 const ids=shuffle(MADKEYS).slice(0,nparts),pal=new Set();let anyWhole=false;
 const parts=ids.map((type,i)=>{
  const I=MADING[type];let target,blocks0=[],explain,sol=null,note='';
  if(kind==='l1'){
   const ds=tier===1?[2,3,4]:tier===2?[4,5,6,8]:[6,8,10,12];
   const d=pick(ds),cp=coprimes(d).filter(x=>x<=(tier===1?3:tier===2?5:7));
   const n=pick(cp.length?cp:[1]);target={n,d,form:'proper'};pal.add(d);sol=[{k:'blk',d,c:n}];
   explain=`${n===1?`Drop one 1/${d} block.`:`Drop ${n} blocks of 1/${d}, then <b>Combine</b> them into one ${n}/${d} block.`}`;
  }else if(kind==='l2'){
   const ds=tier===1?[2,3,4]:tier===2?[3,4,5,6]:[4,5,6,8];
   let d,n,k,N,D;
   do{d=pick(ds);n=pick(coprimes(d));k=pick(tier===1?[2,3]:[2,3,4]);N=n*k;D=d*k}while(N>10||D>24);
   target={n,d,form:'proper'};
   if(tier>=2&&Math.random()<.6){
    const a=rnd(1,N-1);blocks0=[{n:a,d:D},{n:N-a,d:D}];
    if(tier===3&&D%2===0&&(N-a)%2===0&&Math.random()<.6){blocks0=[{n:a,d:D},{n:(N-a)/2,d:D/2}]}
    pal.add(d);note='The assistant already poured some in. Tidy it up!';
    explain=`Start with the blocks you have. ${blocks0[1].d!==blocks0[0].d?`<b>Slice</b> the bigger piece so both are ${D}ths, then `:''}<b>Combine</b> into ${N}/${D}, then <b>Simplify</b> (divide top and bottom by ${k}) to ${n}/${d}.`;
   }else{
    pal.add(D);sol=[{k:'blk',d:D,c:N}];
    explain=`Drop ${N} blocks of 1/${D}, <b>Combine</b> them into ${N}/${D}, then <b>Simplify</b> (divide top and bottom by ${k}) to get ${n}/${d}.`;
   }
  }else{
   const ds=tier===1?[2,3,4]:tier===2?[3,4,5,6]:[4,5,6,8];
   const d=pick(ds),w=tier===1?1:tier===2?rnd(1,2):rnd(1,3),r=pick(coprimes(d)),N=w*d+r;
   const mixed=Math.random()<.6;anyWhole=true;
   if(mixed){
    target={n:N,d,form:'mixed'};pal.add(d);
    if(N>9||Math.random()<.55){blocks0=[{n:N,d}];note=`It bubbled over: ${N}/${d} ${I.pl}! Regroup the full ${I.pl} into wholes.`}else sol=[{k:'blk',d,c:N}];
    explain=`${N}/${d} holds ${w} whole${w>1?'s':''} (${w} \u00D7 ${d} = ${w*d}) with ${r} left over. ${blocks0.length?'':`Drop ${N} blocks of 1/${d}, <b>Combine</b> them, then `}Use <b>Regroup</b> to get ${w} whole${w>1?'s':''} plus ${r}/${d}.`;
   }else{
    target={n:N,d,form:'improper'};pal.add(d);
    blocks0=[{n:w,d:1},{n:r,d}];note='This formula wants ONE improper-fraction dose.';

 });

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

const CFIRST={lightning:['Sparky','Zappo','Volta'],moon:['Luna','Moonbeam','Glimmer'],toenail:['Clawdia','Scalesworth','Snaggle'],goo:['Gloop','Wobblina','Boo-Blob'],ink:['Squiggles','Inky','Captain Suckers'],sneeze:['Sparkle','Ah-Choo','Twinkletoes'],phoenix:['Blaze','Flapjack','Toasty'],troll:['Burpington','Gassy Gus','Rumbles'],yeti:['Fluffernutter','Snowbeard','Floof']};
const CLAST=['McWiggles','the Magnificent','von Bubbles','Fluffbottom','the Slightly Damp','Zapsworth','the Third-and-a-Half','Gigglesnort','Noodlehead','of the Cauldron','Pickleworth','the Unstable'];
const PHRASES=['Blorp! Is it snack time?','I am 100% fraction and 0% sense!','Who wants a soggy hug?','Bwa-ha-ha... achoo!','I simplify, therefore I am!','My favorite number is three-quarters-ish.','Do not poke the goo. Okay, poke it once.','I was brewed for greatness. And naps.','Ooh, a flask! Can I lick it?','Fear me! Or tickle me. Your choice.'];
function makeCreature(){
 const seed=Math.floor(Math.random()*2**31);const R=rng(seed+7);
 const traits=B.holders.map(h=>{const r=redu(h.target.n,h.target.d);return{type:h.type,N:r.n,D:r.d}});
 const big=traits.slice().sort((a,b)=>b.N/b.D-a.N/a.D)[0];
 const first=pick((CFIRST[big.type]||['Glorbo']));
 const name=`${first} ${CLAST[Math.floor(R()*CLAST.length)]}`;
 const ft=traits[Math.floor(R()*traits.length)],I=MADING[ft.type];
 const phrase=R()<.5?`I have ${txm(ft.N,ft.D)} ${ft.N>ft.D?I.featPl:I.feat} and zero regrets!`:PHRASES[Math.floor(R()*PHRASES.length)];
 return{v:2,name,phrase,seed,col:BODYCOL[Math.floor(R()*BODYCOL.length)],traits,d:Date.now()};
}
function traitList(c){return c.traits.map(t=>{const I=MADING[t.type];return `<li>${showVal(t.N,t.D)} ${t.N>t.D?I.pl:I.unit} ${esc(I.noun)} \u2192 <b>${showVal(t.N,t.D)} ${t.N>t.D?I.featPl:I.feat}</b></li>`}).join('')}
function labReveal(c){
 B.revealed=true;document.body.classList.add('revealed');
 const el=$('#reveal');if(!el)return;
 const sc=$('#labscene');if(sc)sc.classList.add('zapped');
 el.innerHTML=`<div class="reveal"><div class="zapflash"></div><div class="revcr">${creatureSVG(c,{alt:c.name})}</div><h3>${esc(c.name)}</h3><p class="phrase">\u201C${esc(c.phrase)}\u201D</p><ul class="traits">${traitList(c)}</ul></div>`;
 try{sfx('zap')}catch(e){}
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(innerWidth<=700||innerHeight<=500)el.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});
}
function labSaveCreature(){
 const c=makeCreature();
 S.gallery.unshift(c);S.gallery=S.gallery.slice(0,60);
 G.built=(G.built||0)+1;save();labReveal(c);return c;
}

}

function galleryCard(g){
 if(g.v===2)return `<div class="gc madgc">${creatureSVG(g,{alt:g.name})}${esc(g.name)}<small class="phrase">\u201C${esc(g.phrase)}\u201D</small><small>${g.traits.map(t=>`${txm(t.N,t.D)} ${t.N>t.D?MADING[t.type].pl:MADING[t.type].unit} ${MADING[t.type].noun}`).join(' \u00B7 ')}</small></div>`;

}

/* ===== Run flow ===== */
const REW={full:20,partial:16,retry:10,shown:0};
function award(x){if(x<=0)return;G.score+=x;S.coins+=x;save();sfx('coin');updateHud()}
function pct(r){return r.att?Math.round(100*(r.full+.5*r.partial)/r.att):null}
function modal(h){$('#modal').innerHTML=h?`<div class="modal"><div class="card">${h}</div></div>`:''}
function startRun(mode,level){
 G={mode,level,t0:Date.now(),qn:0,total:MODES[mode].total,answered:0,full:0,partial:0,retry:0,shown:0,score:0,q:null,qs:null,streak:0,stage:'q',hintsUsed:0,built:0,lastKind:null};
 audio();
 $('#screen').innerHTML=`<div class="hud" id="hud"></div><section class="card" id="qcard" aria-live="polite"></section>`;
 updateHud();nextPuzzle();
}
function updateHud(){
 if(!G||!$('#hud'))return;
 const bk=G.mode==='bakery';
 let h=`<button class="btn small ghost" data-act="quit">\u2190 Home</button><span class="pill opt">${MODES[G.mode].name}</span><span class="pill g">Coins: ${S.coins}</span><span class="pill">${bk?'Order':'Creature'} ${Math.min(G.qn,G.total)} of ${G.total}</span><span class="pill opt" title="Perfect first tries in a row">Streak: ${G.streak}</span><span class="sp"></span>`;
 if(bk)h+=`<button class="btn small gold" data-act="shop">Shop</button>`;
 h+=`<button class="btn small ghost" data-act="mute" aria-label="Toggle sound">${S.settings.mute?'Sound: off':'Sound: on'}</button>`;
 $('#hud').innerHTML=h;
}
function pickKind(){
 const ids=G.mode==='bakery'?BAKEIDS:LABIDS;
 if(G.level!=='mix')return G.level;
 return wpick(ids.map(id=>{const r=rec(id),miss=r.att>=2?1-(r.full+.5*r.partial)/r.att:.4;let w=(id==='l1'||id==='b1'?1.5:2)*(1+2*miss);if(id===G.lastKind)w*=.35;return[id,w]}));
}
function nextPuzzle(){
 if(G.qn>=G.total)return endRun(true);
 G.qn++;
 const big=G.mode==='bakery'&&G.level==='mix'&&G.qn===G.total;
 const kind=big?'b5':pickKind();G.lastKind=kind;
 const pz=G.mode==='bakery'?genBake(kind,rec(kind).tier):genLab(kind,rec(kind).tier);
 beginBoard(pz);
}
function beginBoard(pz){
 G.q={skill:pz.skill,label:pz.label,big:!!pz.big};
 G.qs={wrong:0,hint:0,shown:false,partial:false,done:false,granted:0,tags:[],t0:Date.now()};
 G.stage='q';
 const bk=pz.mode==='bakery';
 B={pz,holders:pz.holders.map(h=>Object.assign({},h,{blocks:h.blocks0.map(b=>Object.assign({},b))})),hist:[],sel:null,hold:null,preview:null,col:pick(BCOLS),
  onDone:bk?bakeryDone:labDone,onShown:bk?bakeryShown:labShown,after:bk?bakeryAfter:labAfter};
 drawBoard(bk?bakeryLeft(pz):labLeft(pz));
}
function drawBoard(left){
 const pz=B.pz,r=rec(pz.skill),bk=pz.mode==='bakery';
 let h=`<div class="row"><span class="skillbadge">${esc(pz.badge)}</span><span class="sp"></span>${r.tier>1?`<small class="star">${'\u2605'.repeat(r.tier-1)} power</small>`:''}</div>`;
 h+=blueprintHTML();
 h+=`<div class="labgrid"><div id="leftcol">${left}</div><div id="partscol">${holdersHTML(pz)}</div></div>`;
 h+=`<div class="dock" id="dock">${trayHTML(pz)}${toolsHTML()}<div id="fb" class="fb" role="status"></div><div class="actrow"><div class="tools" id="tools"></div><button class="btn small ghost" data-act="bbundo">Undo</button><div id="bbbtns"><button class="btn green" data-act="bbcheck">Check<span class="chk-long"> my ${bk?'order':'creature'}</span> \u2713</button></div></div></div>`;
 $('#qcard').innerHTML=h;
 setPlay(true);
 bbChanged();bbTools();updateHud();
}
function bbNextBtn(){
 const last=G.qn>=G.total,bk=G.mode==='bakery';
 const b=$('#bbbtns');if(b)b.innerHTML=`<button class="btn green" data-act="next">${last?'Finish \u2713':bk?'Next order \u25B8':'Next creature \u25B8'}</button>${bk?'':`<button class="btn ghost" data-act="gallery">See gallery</button>`}`;
 G.stage='next';
}
function finishPuzzle(outcome){
 const q=G.q,qs=G.qs;qs.done=true;
 const r=rec(q.skill);r.att++;r[outcome]++;
 G.answered++;G[outcome]++;
 let levelMsg='';
 if(outcome==='full'){r.streak++;r.bad=0;G.streak++;
  if(r.streak>=3&&r.tier<3){r.tier++;r.streak=0;levelMsg=`Skill power up! ${SK[q.skill].n} is now a bit trickier.`}}
 else if(outcome==='partial'){}
 else{r.streak=0;G.streak=0;r.bad++;if(r.bad>=2&&r.tier>1){r.tier--;r.bad=0;levelMsg='Let\u2019s practice this a little more gently for a bit.'}}
 if(outcome!=='full'){S.misses.unshift({l:q.label,s:q.skill,o:outcome,t:Date.now()});S.misses=S.misses.slice(0,15)}
 save();
 const rw=Math.max(0,REW[outcome]*(q.big?2:1)-qs.granted);
 if(rw>0)award(rw);
 if(outcome==='full'&&G.streak>1)award(Math.min(G.streak,6)-1);
 updateHud();bbTools();
 if(levelMsg)setTimeout(()=>toast(levelMsg,3000),600);
 B.after(outcome);
}
function endRun(finished){
 setPlay(false);
 const g=G,mode=g.mode;
 S.sessions.unshift({d:Date.now(),m:mode,n:g.answered,full:g.full,partial:g.partial,retry:g.retry,shown:g.shown,score:g.score});S.sessions=S.sessions.slice(0,30);
 S.best[mode]=Math.max(S.best[mode]||0,g.score);save();
 G=null;B=null;
 const bk=mode==='bakery';
 $('#screen').innerHTML=`<div class="top"><button class="btn small ghost" data-act="home">\u2190 Home</button><span class="pill">${MODES[mode].name}</span></div>
 <div class="card center"><h1>${finished?(bk?'The bakery closes for the day!':'The lab is all done!'):'Nice work today!'}</h1>
 <p style="font-size:1.2rem">You earned <b>${g.score} coins</b> this round. Your bank: <b>${S.coins}</b>.</p>
 <div class="row" style="justify-content:center;margin:10px 0"><span class="pill g" style="padding:.3em .9em;border-radius:99px;background:#fff4c9;font-weight:800">${g.answered} ${bk?'orders':'creatures'}</span><span class="pill g" style="padding:.3em .9em;border-radius:99px;background:#dcf7e7;font-weight:800">Perfect first tries: ${g.full}</span><span class="pill g" style="padding:.3em .9em;border-radius:99px;background:#e4f0ff;font-weight:800">Right but tidy-up needed: ${g.partial}</span><span class="pill g" style="padding:.3em .9em;border-radius:99px;background:#f1edff;font-weight:800">Got it with help: ${g.retry+g.shown}</span></div>
 <p>${bk?`Orders served all-time: <b>${S.bakery.served}</b>. Big Bake trophies: <b>${S.bakery.trophies}</b>.`:`Creatures in your gallery: <b>${S.gallery.length}</b>.`}</p>
 <div class="row" style="justify-content:center"><button class="btn gold" data-act="again" data-m="${mode}" data-l="${g.level}">Play again</button>${bk?`<button class="btn" data-act="shop">Shop</button>`:`<button class="btn" data-act="gallery">Gallery</button>`}<button class="btn ghost" data-act="home">Home</button></div></div>`;
 if(finished){confetti(160);sfx('win')}
}

function missed(){return ALLSK.map(id=>({id,p:pct(rec(id)),att:rec(id).att})).filter(x=>x.att>=3&&x.p!==null&&x.p<85).sort((a,b)=>a.p-b.p).slice(0,3)}
function summaryText(){
 const d=new Date(),ds=d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
 const tot=ALLSK.reduce((s,id)=>s+rec(id).att,0);
 let t=`Batter Blocks (fraction bakery) practice summary for Kenny \u2013 ${ds}\nRounds played: ${S.sessions.length} (most recent 30) | Puzzles answered: ${tot}\n\nScore by skill (full credit = perfect first try; partial credit = right amount but needed a nudge, e.g. to simplify or regroup):\n`;
 ALLSK.forEach(id=>{const r=rec(id),p=pct(r);t+=` ${SK[id].n}. ${SK[id].name}: ${p===null?'not tried yet':p+'% over '+r.att+' puzzles (perfect '+r.full+', partial '+r.partial+', retried '+r.retry+', needed the walk-through '+r.shown+')'}; difficulty level ${r.tier} of 3\n`});
 const worst=missed();t+=`\nMost-missed skills: ${worst.length?worst.map(w=>SK[w.id].name+' ('+w.p+'%)').join('; '):'not enough data yet'}\n`;
 const tg=Object.keys(S.tags).filter(k=>S.tags[k]>0).map(k=>`${TAGNAME[k]||k}: ${S.tags[k]}`);
 t+=`Habits to watch: ${tg.length?tg.join('; '):'none noticed yet'}\n`;
 if(S.misses.length)t+=`Recent stumbles: ${S.misses.slice(0,8).map(m=>m.l).join('; ')}\n`;
 t+=`Bakery orders served: ${S.bakery.served} | Big Bake trophies: ${S.bakery.trophies} | Creatures built: ${S.gallery.length}\n`;
 t+=`Best scores: Fraction Bakery ${S.best.bakery}, Creature Lab ${S.best.lab}\n`;

/* Touch safety net: if a finger tap on a button does not produce a click (some mobile browsers drop it
   after a drag), run the button's action ourselves. A late real click is then ignored, so nothing runs twice. */
let PEND=null,LASTP=null,FBEL=null,FBT=0;
document.addEventListener('pointerdown',e=>{
